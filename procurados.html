<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurados - New Seas OP</title>
    <link href="https://fonts.googleapis.com/css?family=Quantico:700|Comfortaa:400,700|Verdana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn">🎨</button>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="content-wrapper">
            <section class="content-section text-center">
                <h1 class="title-quantico" style="font-size: 42px; color: var(--accent-color); text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Procurados</h1>
                <p class="section-title" style="font-size: 16px; opacity: 0.8; margin-bottom: 30px;">Abaixo constam as cabeças de todos os jogadores que possuem recompensas sobre si. A Marinha exige cautela ao confrontar estes indivíduos.</p>
            </section>

            <section class="content-section">
                <div class="box-content" style="padding: 30px; background: var(--sidebar-bg); border: 1px solid var(--sidebar-border); border-radius: 8px;">
                    
                    <div class="bounty-controls">
                        <select id="sort-bounties" class="bounty-sort-select">
                            <option value="val-desc">Maior Recompensa</option>
                            <option value="val-asc">Menor Recompensa</option>
                            <option value="az">Ordem Alfabética (A-Z)</option>
                            <option value="za">Ordem Alfabética (Z-A)</option>
                        </select>
                    </div>

                    <div class="bounty-grid">
                        <div class="bounty-card">
                            <img src="assets/imagens/Cartazes/" alt="" class="bounty-image">
                            <div class="bounty-info">
                                <h3 class="bounty-name"></h3>
                                <p class="bounty-value"></p>
                            </div>
                        </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
